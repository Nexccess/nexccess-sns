name: 12 Instagram Account Discovery (read only)
on:
  workflow_dispatch:
  push:
    branches: [feature/12-instagram-post-v01]
    paths:
      - 'scripts/discover-instagram.js'
      - 'tests/discover-instagram.test.js'
      - '.github/workflows/12-ig-account-check.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests (no remote API)
        run: node --test tests/discover-instagram.test.js
      - name: Verify configured Facebook Page ID without revealing secret
        env:
          CONFIGURED_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          EXPECTED_PAGE_ID: '1144107962110268'
        shell: bash
        run: |
          if [[ -z "$CONFIGURED_PAGE_ID" ]]; then
            echo "PAGE_ID_MISSING"
            exit 1
          fi
          if [[ "$CONFIGURED_PAGE_ID" != "$EXPECTED_PAGE_ID" ]]; then
            echo "PAGE_ID_MISMATCH"
            exit 1
          fi
          echo "PAGE_ID_MATCH"
      - name: Inspect Meta token permissions (read only, redacted)
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v24.0
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.META_PAGE_ACCESS_TOKEN || '';
          const version = process.env.META_GRAPH_VERSION || 'v24.0';
          const wanted = ['instagram_basic','pages_show_list','pages_read_engagement','instagram_content_publish','business_management'];
          if (!token) { console.log('TOKEN_MISSING'); process.exit(0); }
          try {
            const url = new URL('https://graph.facebook.com/' + version + '/me/permissions');
            const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
            const body = await res.json();
            if (!res.ok || body.error) {
              console.log('PERMISSIONS_CHECK_UNAVAILABLE HTTP=' + res.status + ' CODE=' + (body.error?.code ?? 'UNKNOWN'));
            } else {
              const entries = Array.isArray(body.data) ? body.data : [];
              console.log('PERMISSIONS_CHECK_READABLE');
              for (const name of wanted) {
                const row = entries.find(x => x.permission === name);
                console.log('PERMISSION_' + name.toUpperCase() + '=' + (row?.status || 'NOT_LISTED'));
              }
            }
          } catch {
            console.log('PERMISSIONS_CHECK_NETWORK_ERROR');
          }
          NODE
      - name: Read-only account lookup
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v24.0
        run: node scripts/discover-instagram.js
      - name: Save discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 12-ig-account-discovery
          path: artifacts/12-ig/account-discovery.json
          if-no-files-found: warn
