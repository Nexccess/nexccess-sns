name: 12 Instagram Post (manual only)
on:
  push:
    branches: [feature/12-instagram-post-v01]
    paths:
      - 'scripts/post-instagram.js'
      - '.github/workflows/12-instagram.yml'
  workflow_dispatch:
    inputs:
      caption:
        description: 'Approved post text'
        required: true
        type: string
      image_url:
        description: 'Approved publicly accessible HTTPS image URL'
        required: true
        type: string
      publish:
        description: 'Publish publicly (false is dry run)'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  instagram:
    if: ${{ false }} # Instagram work suspended by user request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check scripts/post-instagram.js
      - name: Run Instagram worker
        env:
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_CAPTION: ${{ inputs.caption || '12-IG-01 non-public test' }}
          IG_IMAGE_URL: ${{ inputs.image_url || 'https://example.com/test.png' }}
          APPROVED_POST: ${{ inputs.publish && 'true' || 'false' }}
        run: node scripts/post-instagram.js ${{ inputs.publish && '--publish' || '--dry-run' }}
      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 12-ig-execution
          path: artifacts/12-ig/result.json
          if-no-files-found: warn
