name: 12 Instagram Scheduled Publisher (isolated)
on:
  workflow_dispatch:
  schedule:
    # 18:00 JST daily, only takes effect when this file is on default branch
    - cron: '0 9 * * *'
permissions:
  contents: write
concurrency:
  group: instagram-publisher
  cancel-in-progress: false
jobs:
  instagram:
    if: ${{ vars.IG_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check scripts/instagram-scheduled.js
      - name: Publish one due approved Instagram post
        run: node scripts/instagram-scheduled.js
        env:
          IG_AUTOMATION_ENABLED: ${{ vars.IG_AUTOMATION_ENABLED }}
          IG_USER_ACCESS_TOKEN: ${{ secrets.IG_USER_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-publish-result
          path: artifacts/12-ig/result.json
          if-no-files-found: warn
