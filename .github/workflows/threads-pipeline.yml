name: Threads Pipeline

# Legacy publishing paused. Original triggers are retained below for reference.
# on:
#   workflow_dispatch:
#   schedule:
#     - cron: "0 4 * * *"   # 毎日 13:00 JST
on: workflow_call
jobs:
  post:
    if: ${{ false }}
    name: Generate and Post to Threads
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Post to Threads
        run: node scripts/post-threads.js
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          THREADS_USER_ID:       ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN:  ${{ secrets.THREADS_ACCESS_TOKEN }}
