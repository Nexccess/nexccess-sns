name: Tanpo X Additional Posts Trial
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "1=12:15 JST, 2=19:15 JST"
        required: true
        type: choice
        options: ["1", "2"]
  schedule:
    - cron: "15 3 * * *"
    - cron: "15 10 * * *"
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - name: Install SVG renderer and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-noto-cjk
      - name: Render separate PNG diagrams
        run: |
          rsvg-convert assets/tanpo-equity-diagram.svg -o assets/tanpo-equity-diagram.png
          rsvg-convert assets/tanpo-consolidation-diagram.svg -o assets/tanpo-consolidation-diagram.png
          file assets/tanpo-*-diagram.png
      - name: Validate script syntax
        run: node --check scripts/post-x-extra.js
      - name: Dry-run check before posting
        run: node scripts/post-x-extra.js
        env:
          DRY_RUN: "1"
          X_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || (github.event.schedule == '15 3 * * *' && '1' || '2') }}
      - name: Post X (7-day trial only)
        run: node scripts/post-x-extra.js
        env:
          X_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || (github.event.schedule == '15 3 * * *' && '1' || '2') }}
          X_APP_KEY: ${{ secrets.X_APP_KEY }}
          X_APP_SECRET: ${{ secrets.X_APP_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
