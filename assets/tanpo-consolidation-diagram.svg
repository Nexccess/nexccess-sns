<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><rect width="1200" height="1000" fill="#FAFCFA"/><rect width="1200" height="186" fill="#123E38"/><text x="70" y="90" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="47" font-weight="700" fill="#FFFFFF">複数ローンの一本化を検討</text><text x="70" y="146" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="29" fill="#D6F1DC">不動産を活用した返済条件の見直し</text><g font-family="Noto Sans JP, Yu Gothic, sans-serif"><rect x="70" y="230" width="1060" height="116" rx="18" fill="#EDF2F7"/><text x="108" y="290" font-size="41" font-weight="700" fill="#173A35">現在：複数の借入</text><text x="108" y="337" font-size="31" fill="#365E55">住宅ローン・カードローン・教育ローン・マイカーローン</text><rect x="70" y="384" width="1060" height="116" rx="18" fill="#E5F1EA"/><text x="108" y="444" font-size="41" font-weight="700" fill="#173A35">検討：不動産担保ローン等</text><text x="108" y="491" font-size="31" fill="#365E55">対応商品への借り換え・一本化の可否を確認</text><rect x="70" y="538" width="1060" height="116" rx="18" fill="#EDF2F7"/><text x="108" y="598" font-size="41" font-weight="700" fill="#173A35">比較：月々の返済と総返済額</text><text x="108" y="645" font-size="31" fill="#365E55">月額負担が減っても総返済額・担保リスクに注意</text></g><rect x="70" y="857" width="1060" height="3" fill="#C5DACB"/><text x="70" y="914" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="23" fill="#3F514D">※住宅ローンへ他の借入を直接組み込めるとは限りません。</text><text x="70" y="960" font-family="Arial,sans-serif" font-size="25" fill="#1D6457">fudousan-tanpo.tokyo</text></svg>