<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><rect width="1200" height="1000" fill="#FAFCFA"/><rect width="1200" height="186" fill="#123E38"/><text x="70" y="90" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="47" font-weight="700" fill="#FFFFFF">住宅ローン返済で生まれる可能性</text><text x="70" y="146" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="29" fill="#D6F1DC">自宅の担保余力を確認する3つのポイント</text><g font-family="Noto Sans JP, Yu Gothic, sans-serif"><rect x="70" y="230" width="1060" height="116" rx="18" fill="#EDF2F7"/><text x="108" y="290" font-size="41" font-weight="700" fill="#173A35">1 住宅ローン残債</text><text x="108" y="337" font-size="31" fill="#365E55">返済により残債が減少しているかを確認</text><rect x="70" y="384" width="1060" height="116" rx="18" fill="#E5F1EA"/><text x="108" y="444" font-size="41" font-weight="700" fill="#173A35">2 現在の不動産評価</text><text x="108" y="491" font-size="31" fill="#365E55">取得時から価格や担保評価が変化しているかを確認</text><rect x="70" y="538" width="1060" height="116" rx="18" fill="#EDF2F7"/><text x="108" y="598" font-size="41" font-weight="700" fill="#173A35">3 追加融資・借り換え</text><text x="108" y="645" font-size="31" fill="#365E55">条件が合えば新たな資金調達の可能性を検討</text></g><rect x="70" y="857" width="1060" height="3" fill="#C5DACB"/><text x="70" y="914" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="23" fill="#3F514D">※評価額と残債の単純な差額が融資可能額になるわけではありません。</text><text x="70" y="960" font-family="Arial,sans-serif" font-size="25" fill="#1D6457">fudousan-tanpo.tokyo</text></svg>